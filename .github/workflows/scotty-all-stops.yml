name: Vorarlberg Scotty Kennungen erweitern
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Haltestellenkennungen ergänzen
        run: |
          python3 - <<'PY'
          import json,urllib.request,time
          with open('stops.json',encoding='utf-8') as f:
              names=sorted({x['name'] for x in json.load(f)['stops'] if x.get('name')})
          try:
              with open('scotty-stops.json',encoding='utf-8') as f: known=json.load(f)
          except FileNotFoundError: known={}
          try:
              with open('scotty-progress.json') as f: offset=json.load(f)['offset']
          except FileNotFoundError: offset=0
          if offset>=len(names): offset=0
          batch=names[offset:offset+80]
          for name in batch:
              req={'id':'1','ver':'1.67','lang':'deu','auth':{'type':'AID','aid':'OWDL4fE4ixNiPBBm'},'client':{'id':'OEBB','type':'WEB','name':'webapp','l':'vs_webapp'},'formatted':False,'svcReqL':[{'req':{'input':{'field':'S','loc':{'name':name,'type':'ALL'},'maxLoc':12}},'meth':'LocMatch'}]}
              request=urllib.request.Request('https://fahrplan.oebb.at/bin/mgate.exe',data=json.dumps(req).encode(),headers={'Content-Type':'application/json','User-Agent':'Mozilla/5.0'})
              try:
                  with urllib.request.urlopen(request,timeout=18) as response: data=json.load(response)
                  matches=data['svcResL'][0]['res']['match']['locL']
                  exact=[x for x in matches if x.get('name','').casefold()==name.casefold() and x.get('extId')]
                  if exact:
                      x=exact[0]
                      known[name]={'name':x['name'],'id':str(x['extId']),'lid':x.get('lid','')}
              except Exception as e:
                  print('Skipped',name,str(e))
              time.sleep(.2)
          with open('scotty-stops.json','w',encoding='utf-8') as f: json.dump(known,f,ensure_ascii=False)
          with open('scotty-progress.json','w') as f: json.dump({'offset':offset+len(batch)},f)
          print('Processed',len(batch),'known IDs',len(known))
          PY
      - name: Dateien veröffentlichen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scotty-stops.json scotty-progress.json
          if ! git diff --cached --quiet; then
            git commit -m "Expand Scotty stop IDs"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
