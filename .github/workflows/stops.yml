name: Haltestellen Vorarlberg aktualisieren
on:
  workflow_dispatch:
  schedule:
    - cron: '15 4 * * 1'
  push:
    paths:
      - '.github/workflows/stops.yml'
permissions:
  contents: write
jobs:
  update-stops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: VMOBIL GTFS Haltestellen extrahieren
        run: |
          python3 - <<'PY'
          import csv, io, json, urllib.request, zipfile
          from datetime import datetime, timezone
          url='https://gtfs-source-feeds.transit.land/at-mvo-58.zip'
          req=urllib.request.Request(url,headers={'User-Agent':'VorarlbergTarifrechner/1.0 (GitHub Pages public project)'})
          with urllib.request.urlopen(req,timeout=90) as r:
              raw=r.read()
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              filename=next(n for n in z.namelist() if n.lower().endswith('stops.txt'))
              rows=csv.DictReader(io.TextIOWrapper(z.open(filename),encoding='utf-8-sig'))
              stops=[]
              for r in rows:
                  try: lat=float(r['stop_lat']);lon=float(r['stop_lon'])
                  except (ValueError,KeyError):continue
                  if 46.7<=lat<=47.65 and 9.3<=lon<=10.35 and r.get('stop_name'):
                      stops.append({'name':r['stop_name'],'lat':round(lat,6),'lon':round(lon,6)})
          if len(stops)<500:raise RuntimeError('Zu wenige Haltestellen: '+str(len(stops)))
          data={'source':'VMOBIL GTFS via Transitland','updated':datetime.now(timezone.utc).isoformat(),'stops':stops}
          with open('stops.json','w',encoding='utf-8') as f:json.dump(data,f,ensure_ascii=False,separators=(',',':'))
          print('Haltestellen:',len(stops))
          PY
      - name: Datei veröffentlichen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stops.json
          if ! git diff --cached --quiet; then
            git commit -m "Update VMOBIL stops dataset"
            git push
          fi
