name: Haltestellen Vorarlberg aktualisieren
on:
  workflow_dispatch:
  schedule:
    - cron: '15 4 * * 1'
  push:
    paths:
      - '.github/workflows/stops.yml'
permissions:
  contents: write
jobs:
  update-stops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: OpenStreetMap Haltestellenliste erzeugen
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse
          from datetime import datetime, timezone
          q='[out:json][timeout:120];(node["highway"="bus_stop"](46.7,9.3,47.65,10.35);node["railway"~"^(station|halt)$"](46.7,9.3,47.65,10.35);node["public_transport"="platform"](46.7,9.3,47.65,10.35););out body;'
          req=urllib.request.Request('https://overpass.private.coffee/api/interpreter',data=urllib.parse.urlencode({'data':q}).encode(),headers={'User-Agent':'VorarlbergTarifrechner/1.0 (https://github.com/mattersbergerrobert-creator/Vorarlberg-Tarifrechner-Web)'})
          with urllib.request.urlopen(req,timeout=180) as r:
              data=json.load(r)
          stops=[]
          for x in data.get('elements',[]):
              name=x.get('tags',{}).get('name')
              if name and 'lat' in x and 'lon' in x:
                  stops.append({'name':name,'lat':round(x['lat'],6),'lon':round(x['lon'],6)})
          if len(stops)<250:raise RuntimeError('Zu wenige Haltestellen: '+str(len(stops)))
          data={'source':'OpenStreetMap contributors (ODbL), via Overpass','updated':datetime.now(timezone.utc).isoformat(),'stops':stops}
          with open('stops.json','w',encoding='utf-8') as f:json.dump(data,f,ensure_ascii=False,separators=(',',':'))
          print('Haltestellen:',len(stops))
          PY
      - name: Datei veröffentlichen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stops.json
          if ! git diff --cached --quiet; then
            git commit -m "Update VMOBIL stops dataset"
            git push
          fi
