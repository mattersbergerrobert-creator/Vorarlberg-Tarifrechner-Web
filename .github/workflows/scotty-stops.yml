name: Scotty Haltestellenkennungen abrufen
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/scotty-stops.yml']
permissions:
  contents: write
jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Offizielle Haltestellenkennung ermitteln
        run: |
          python3 - <<'PY'
          import json,urllib.request,time
          names=['Bregenz St. Bern','Dornbirn Bahnhof','Bregenz Bahnhof','Wolfurt Bahnhof']
          out={}
          for name in names:
              req={'id':'1','ver':'1.67','lang':'deu','auth':{'type':'AID','aid':'OWDL4fE4ixNiPBBm'},'client':{'id':'OEBB','type':'WEB','name':'webapp','l':'vs_webapp'},'formatted':False,'svcReqL':[{'req':{'input':{'field':'S','loc':{'name':name,'type':'ALL'},'maxLoc':12}},'meth':'LocMatch'}]}
              request=urllib.request.Request('https://fahrplan.oebb.at/bin/mgate.exe',data=json.dumps(req).encode(),headers={'Content-Type':'application/json','User-Agent':'Mozilla/5.0'})
              try:
                  with urllib.request.urlopen(request,timeout=25) as r: result=json.load(r)
                  matches=result['svcResL'][0]['res']['match']['locL']
                  exact=[x for x in matches if x.get('name','').casefold()==name.casefold() and x.get('extId')]
                  if exact: out[name]= {'name':exact[0]['name'],'id':str(exact[0]['extId']),'lid':exact[0].get('lid','')}
                  print(name,'matches',len(matches),'exact',bool(exact))
              except Exception as e: print(name,'failed:',str(e))
              time.sleep(1)
          if not out: raise SystemExit('Keine IDs ermittelt')
          with open('scotty-stops.json','w') as f:json.dump(out,f,ensure_ascii=False)
          PY
      - name: Kennungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scotty-stops.json
          git diff --cached --quiet || (git commit -m "Cache official Scotty station IDs" && git pull --rebase origin main && git push origin HEAD:main)
