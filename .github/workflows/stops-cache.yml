name: Vorarlberg Haltestellen zwischenspeichern
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/stops-cache.yml'
  schedule:
    - cron: '23 3 * * 0'
permissions:
  contents: write
jobs:
  stops:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Haltestellen von OpenStreetMap abrufen
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, time
          from datetime import datetime, timezone
          q='[out:json][timeout:120];(node["highway"="bus_stop"](46.75,9.45,47.65,10.30);node["railway"~"^(station|halt)$"](46.75,9.45,47.65,10.30);node["public_transport"="platform"](46.75,9.45,47.65,10.30););out body;'
          endpoints=[
            'https://overpass.kumi.systems/api/interpreter',
            'https://overpass.private.coffee/api/interpreter',
            'https://overpass-api.de/api/interpreter',
            'https://overpass.nchc.org.tw/api/interpreter',
            'https://overpass.ultra.cc/api/interpreter']
          stops=[]
          for endpoint in endpoints:
            try:
              req=urllib.request.Request(endpoint+'?'+urllib.parse.urlencode({'data':q}),headers={'User-Agent':'VorarlbergTarifrechner/1.0 (open-source GitHub Pages)'})
              with urllib.request.urlopen(req,timeout=130) as response:
                result=json.load(response)
              stops=[{'name':x['tags']['name'],'lat':round(x['lat'],6),'lon':round(x['lon'],6)} for x in result.get('elements',[]) if x.get('tags',{}).get('name') and 'lat' in x and 'lon' in x]
              print(endpoint,'returned',len(stops),'named stops')
              if len(stops)>=250:break
            except Exception as exc:print(endpoint,'failed:',repr(exc))
          if len(stops)<250:raise RuntimeError('No valid dataset; existing website data left unchanged')
          with open('stops.json','w',encoding='utf-8') as f:
            json.dump({'source':'© OpenStreetMap contributors, ODbL','updated':datetime.now(timezone.utc).isoformat(),'stops':stops},f,ensure_ascii=False,separators=(',',':'))
          PY
      - name: Datei veröffentlichen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stops.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh cached Vorarlberg stop locations"
            git push
          fi
